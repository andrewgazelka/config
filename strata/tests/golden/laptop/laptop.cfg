// A host layer: only differences.

aerospace {
    // Replaces a `default` without ceremony.
    bindings { alt-a: "layout accordion horizontal", alt-f: "fullscreen" }
    // Replaces a plain value: needs `override`, like mkForce.
    workspace-to-monitor-force-assignment { "9": override "main" }
    // Adds an entry to a map from another file.
    window-rules { "com.apple.Safari": "floating" }
}

zed { font { size: 12 } }
ghostty { font { size: 13 } }
