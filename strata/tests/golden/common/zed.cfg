// Zed.

zed : typography {
    theme { mode: "dark", dark: "Islands Dark", light: "Islands Light" }
    font { size: default 10, weight: 200 }
    terminal { shell { program: "${pkgs.nushell[store-path]}/bin/nu" } }
    extensions: [
        "islands-theme", "catppuccin-icons", "jetbrains-new-ui-icons",
        "nix", "nu", "toml", "tombi", "crates-lsp", "gleam",
    ]

    base_keymap: "JetBrains"
    vim_mode: true
    vim { highlight_on_yank_duration: 0 }
    ui_font_family: "Inter"
    ui_font_size: default 12
    icon_theme { mode: "dark", dark: "Catppuccin Frappé", light: "JetBrains New UI Icons (Light)" }
    // Neutral grey cursor and selection instead of the theme's accent.
    theme_overrides { "Islands Dark" { players: [
        { cursor: "#808080ff", background: "#808080ff", selection: "#8080803d" },
    ] } }
    buffer_line_height { custom: 1.1 }
    "unstable.ui_density": "compact"
    cursor_blink: false
    active_pane_modifiers { inactive_opacity: 0.2 }

    // Chrome: no gutter, scrollbars, toolbar buttons or account UI.
    gutter { line_numbers: false, runnables: false, breakpoints: false, bookmarks: false, folds: false }
    scrollbar { show: "never" }
    toolbar { breadcrumbs: false, quick_actions: false }
    tab_bar { show_nav_history_buttons: false, show_tab_bar_buttons: false }
    tabs {
        activate_on_close: "neighbour", file_icons: true, git_status: true,
        show_close_button: "hidden", show_diagnostics: "all",
    }
    title_bar { show_onboarding_banner: false, show_sign_in: false, show_user_menu: false, show_user_picture: false }
    diagnostics { button: false, inline { enabled: true } }
    centered_layout { left_padding: 0, right_padding: 0 }
    sticky_scroll { enabled: true }
    inlay_hints { enabled: true, show_parameter_hints: false }
    git { inline_blame { enabled: false }, path_style: "file_path_first" }

    // Panels live on the left, agent on the right.
    project_panel {
        dock: "left", button: false, default_width: 200, indent_size: 16,
        entry_spacing: "standard", diagnostic_badges: true, git_status_indicator: true,
        hide_gitignore: true, hide_root: true, scrollbar { show: "never" },
    }
    outline_panel { dock: "left", button: false, default_width: 240, indent_size: 10, scrollbar { show: "never" } }
    git_panel { dock: "left" }
    collaboration_panel { dock: "left" }
    agent {
        dock: "right", button: false,
        default_model { provider: "openai", model: "gpt-5.6-sol", enable_thinking: true, effort: "medium" },
    }
    use_system_prompts: false

    autosave: "on_focus_change"
    tab_size: 2
    vertical_scroll_margin: 20
    search_wrap: false
    close_on_file_delete: true
    completions { words: "enabled" }
    preview_tabs { enable_preview_from_file_finder: true, enable_keep_preview_on_code_navigation: true }
    session { trust_all_worktrees: true }
    telemetry { metrics: false }

    languages {
        Nix {
            language_servers: ["nil", "!nixd"]
            formatter { external { command: "${pkgs.nixfmt[store-path]}/bin/nixfmt" } }
            format_on_save: "on"
        }
        Python { format_on_save: "on" }
        TOML { language_servers: ["crates-lsp", "tombi", "..."] }
    }
    lsp {
        rust-analyzer { initialization_options { check { command: "clippy" } } }
        basedpyright { settings { "basedpyright.analysis" { typeCheckingMode: "standard" } } }
        tombi { settings { lint { rules { tables-out-of-order: "off" } } } }
        // config/nvim is Lua.
        lua-language-server { settings { Lua { diagnostics { globals: ["vim"] } } } }
    }
}

// On top of the JetBrains base keymap and vim mode.
zed.keymap {
    "" { bindings { cmd-1: "workspace::ToggleLeftDock", cmd-i: "agent::Toggle" } }
    Editor {
        bindings {
            ctrl-j: "editor::Hover"
            ctrl-shift-j: "editor::GoToDefinition"
            // Keep cmd-- as zoom out instead of JetBrains' fold.
            "cmd--": null
        }
    }
    ProjectPanel { bindings { cmd-backspace: ["project_panel::Delete", { skip_prompt: true }] } }
    ProjectSearchBar { bindings { shift-enter: "search::SelectPreviousMatch" } }
}
