// Window manager.

const directions = { h: "left", j: "down", k: "up", l: "right" }

aerospace {
    workspace-to-monitor-force-assignment { for n in 1..10 { "${n}": if n == 9 { "secondary" } else { "main" } } }

    bindings {
        for n in 1..10 {
            "alt-${n}": "workspace ${n}"
            "alt-shift-${n}": "move-node-to-workspace ${n}"
        }
        for k, d in directions {
            "alt-${k}": "focus --boundaries-action stop --ignore-floating ${d}"
            "ctrl-alt-shift-${k}": "move ${d}"
            "alt-shift-${k}": "join-with ${d}"
        }
        alt-tab: "workspace-back-and-forth"
        alt-backtick: "focus-back-and-forth"
        // A default: any layer may replace it without `override`.
        alt-a: default "layout tiles accordion"
        alt-shift-e: "balance-sizes"
        alt-shift-minus: "resize smart -50"
        alt-shift-equal: "resize smart +50"
    }

    window-rules {
        "com.apple.FaceTime": "floating"
        "com.obsproject.obs-studio": "floating"
        "com.paulsolt.SuperEasyTimerMac": "floating"
        "com.linear": "tiling"
        "com.microsoft.Excel": "tiling"
        "notion.id": "tiling"
    }
}
