// Ghostty (abridged config).

ghostty : typography {
    font { size: default 12 }
    theme: "dark:custom-dark,light:custom-light"
    split-divider-color: "2a2a2a"
    cursor-style-blink: false
    window-decoration: "none"
    window-padding-x: 5
    window-padding-y: 5
    scrollbar: "never"
    macos-option-as-alt: true
    clipboard-read: "allow"
    confirm-close-surface: false
    // Tear closed surfaces down at once (ghostty#7535).
    undo-timeout: 0
    auto-update: "off"
    custom-shader: ["~/.config/ghostty/shaders/crt.glsl", "~/.config/ghostty/shaders/focus-border.glsl"]
    bindings {
        "cmd+shift+r": "reload_config"
        "cmd+shift+a": "toggle_command_palette"
        // Leave cmd+a to the program inside.
        "cmd+a": "unbind"
        // Text sent to the shell: ctrl+u (kill line), alt+enter, CSI-u cmd+enter.
        "cmd+backspace": r"text:\x15"
        "shift+enter": r"text:\x1b\r"
        "cmd+enter": r"text:\x1b[13;9u"
        "cmd+up": "scroll_to_top"
        "cmd+down": "scroll_to_bottom"
        "alt+tab": "goto_split:next"
        "shift+alt+tab": "goto_split:previous"
    }
}
