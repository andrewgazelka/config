// tmux: tmux.conf from option maps and key tables.

component config-dir: string
component server-options: map(any)     // set -s
component global-options: map(any)     // set -g
component window-options: map(any)     // setw -g
component append-options: map(list(string))  // set -as, one line per item
component environment: map(any)      // set-environment -g
// table -> key -> command; table "prefix" is plain `bind`, "root" is `bind -n`.
component key-tables: map(map(string))
// tmux has no keys of its own here: everything is one of the fields above.
component tmux: {}


rule tmux {
    if exists(tmux) {
        const lines = [
            for k, v in (record(tmux.server-options) ?? {}) { "set -s ${k} ${shquote(v)}" }
            for k, vs in (record(tmux.append-options) ?? {}) { for v in vs { "set -as ${k} ${shquote(v)}" } }
            for k, v in (record(tmux.global-options) ?? {}) { "set -g ${k} ${shquote(v)}" }
            for k, v in (record(tmux.window-options) ?? {}) { "setw -g ${k} ${shquote(v)}" }
            for k, v in (record(tmux.environment) ?? {}) { "set-environment -g ${k} ${shquote(v)}" }
            for table, keys in (record(tmux.key-tables) ?? {}) {
                for key, command in keys {
                    if table == "prefix" { "bind ${shquote(key)} ${command}" }
                    else if table == "root" { "bind -n ${shquote(key)} ${command}" }
                    else { "bind -T ${table} ${shquote(key)} ${command}" }
                }
            }
        ]
        files."${(tmux[config-dir] ?? "~/.config/tmux")}/tmux.conf" { file: text(join(lines, "\n") + "\n") }
    }
}
