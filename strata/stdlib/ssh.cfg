// OpenSSH client: ~/.ssh/config from `ssh.hosts."<pattern>" { Option: ... }`.
// ssh uses the first value it finds for an option, so `*` goes last and
// other hosts follow by name. A list repeats the option; a scope becomes
// `K="v"` pairs (SetEnv); booleans are yes/no.

component config-file: string
component hosts: map(map(any))

rule ssh {
    if exists(ssh.hosts) {
        const hosts = sort-by([
            for name, h in ssh.hosts.* {
                { key: [if name == "*" { 1 } else { 0 }, name], name: name, opts: record(h) }
            }
        ], "key")
        const blocks = [
            for h in hosts {
                join([
                    "Host ${h.name}"
                    for k, v in h.opts {
                        if kind(v) == "list" { for x in v { "  ${k} ${x}" } }
                        else if kind(v) == "record" { "  ${k} ${join([for a, b in v { "${a}=${to-json(str(b))}" }], " ")}" }
                        else if kind(v) == "bool" { if v { "  ${k} yes" } else { "  ${k} no" } }
                        else { "  ${k} ${v}" }
                    }
                ], "\n")
            }
        ]
        files."${ssh[config-file] ?? "~/.ssh/config"}" { file: text(join(blocks, "\n\n") + "\n") }
    }
}
