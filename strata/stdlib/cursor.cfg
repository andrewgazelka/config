// Cursor (VS Code): settings.json and keybindings.json. Cursor's own keys
// sit on `cursor` as it spells them ("editor.fontFamily": ...).
//
//   cursor.keybindings."<key>"."<command>" { when: "..."; args { ... } }
//   cursor.keybindings."<key>" { unbind: ["<command>", ...] }

component config-dir: string
// Each key's commands are scopes holding the entry's own keys; `unbind`
// lists commands to remove from it (`-command` entries).
component keybindings: map({ unbind?: set(string), ..: map(any) })


rule cursor {
    if exists(cursor) {
        const dir = (cursor[config-dir] ?? "~/Library/Application Support/Cursor/User")
        const settings = record(cursor)
        if len(settings) > 0 {
            // The settings UI rewrites this file: a copy, like zed's.
            files."${dir}/settings.json" { file: copy(json(settings)) }
        }
        if exists(cursor.keybindings) {
            // VS Code reads entries in order; sorting by "<key> <command>" keeps
            // each key's unbinds ("-command") before its bindings.
            const entries = sort-by([
                for key, k in cursor.keybindings.* {
                    for c in k[unbind] ?? [] {
                        { sort: "${key} -${c}", entry: { key: key, command: "-${c}" } }
                    }
                    for command, b in k.* {
                        { sort: "${key} ${command}", entry: { ...record(b), key: key, command: command } }
                    }
                }
            ], "sort")
            files."${dir}/keybindings.json" { file: json([for e in entries { e.entry }]) }
        }
    }
}
