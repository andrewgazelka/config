// Starship: one TOML file. Starship's keys sit on `starship` as it spells
// them; custom modules are scopes, so they can share a prefab:
// `starship.custom.x : sh-module { command: "..." }`.

component config-file: string
component config-dir: string


// A custom module run through `sh -c`.
prefab sh-module {
    shell: ["sh", "-c"]
    use_stdin: false
    ignore_timeout: true
    style: "dimmed"
}

rule starship {
    if exists(starship) {
        files."${starship[config-file] ?? "${starship[config-dir] ?? "~/.config"}/starship.toml"}" {
            file: toml(record(starship))
        }
    }
}
