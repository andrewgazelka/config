        // Shell command to run for the subagent status line
        command: string
        // Must be "command"
        type: "command"
    }
    // Disable syntax highlighting in diffs, code blocks, and file previews.
    syntaxHighlightingDisabled?: bool
    // Default model for agent team teammates when the spawn prompt does not specify one.
    teammateDefaultModel?: (string | null)
    // How agent team teammates display: "auto" picks split panes in tmux or iTerm2, in-process otherwise; "iterm2" (added in v2.1.186) forces iTerm2 native split panes and requires the it2 CLI (it shows an error with the install command if it2 is missing).
    teammateMode?: ("auto" | "in-process" | "tmux" | "iterm2")
    // Enable the terminal progress bar that shows progress in supported terminals like Windows Terminal and iTerm2 (default: true)
    terminalProgressBarEnabled?: bool
    // Color theme for the interface: auto, dark, light, the daltonized variants (deuteranopia-friendly), the ansi variants (16-color terminals), or a custom theme reference such as custom:<slug> or custom:<plugin-name>:<slug>.
    theme?: (("auto" | "dark" | "light" | "dark-daltonized" | "light-daltonized" | "dark-ansi" | "light-ansi") | string)
    // TUI rendering mode.
    tui?: ("fullscreen" | "default")
    // When true, apply the auto mode classifier during plan mode to auto-approve safe read-only tool calls while planning.
    useAutoModeDuringPlan?: bool
    // Show full tool output instead of truncated summaries.
    verbose?: bool
    // Transcript view mode.
    viewMode?: ("default" | "verbose" | "focus")
    // Map two-key INSERT-mode sequences to Escape in vim editor mode.
    vimInsertModeRemaps?: map(string)
    // Voice dictation settings: enabled turns dictation on, mode selects "hold" or "tap", and autoSubmit sends the prompt on key release in hold mode.
    voice?: {
        // In hold mode, auto-submit the prompt on key release when the transcript is at least three words long
        autoSubmit?: bool
        // Enable push-to-talk voice dictation input
        enabled?: bool
        // Recording mode: "hold" (default) is push-to-talk; "tap" taps once to start and again to stop and submit
        mode?: ("hold" | "tap")
    }
    // Legacy alias for voice.enabled; prefer the voice object.
    voiceEnabled?: bool
    // In fullscreen rendering, accelerate mouse-wheel scroll speed during fast scrolls (v2.1.174+).
    wheelScrollAccelerationEnabled?: bool
    // Whether including the keyword "ultracode" in a prompt triggers a dynamic workflow.
    workflowKeywordTriggerEnabled?: bool
    // Sets the agent count Claude aims for in the dynamic workflows it writes.
    workflowSizeGuideline?: ("unrestricted" | "small" | "medium" | "large")
    // Configuration for --worktree sessions.
    worktree?: {
        // Whether to branch worktrees from origin/<default> (fresh) or local HEAD (head).
        baseRef?: ("fresh" | "head")
        // Isolation mode for background sessions.
        bgIsolation?: ("worktree" | "none")
        // Directories to check out in each worktree via git sparse-checkout (cone mode).
        sparsePaths?: list(string)
        // Directories to symlink from the main repository into each worktree to avoid duplicating large directories on disk.
        symlinkDirectories?: list(string)
    }
    // (Windows managed settings only) When true, Claude Code on WSL reads managed settings from the Windows policy chain in addition to /etc/claude-code, with Windows sources taking priority.
    wslInheritsWindowsSettings?: bool
    ..
}

type claude-settings-hook-command = ({
    // Argument list for exec form.
    args?: list(string)
    // Run this hook asynchronously without blocking Claude Code
    async?: bool
    // When true, the hook runs in the background and wakes the model when it exits with code 2.
    asyncRewake?: bool
    // Shell command to execute
    command: string
    // Optional permission-rule-syntax filter (e.g., "Bash(git *)").
    if?: string
    // Shell interpreter for the command.
    shell?: ("bash" | "powershell")
    // Custom spinner message displayed while the hook runs
    statusMessage?: string
    // Optional timeout in seconds (default: 600; lowered to 30 on UserPromptSubmit and 10 on MessageDisplay)
    timeout?: number
    // Hook type
    type: "command"
} | {
    // When the prompt returns ok: false, feed the reason back to Claude and continue the turn instead of stopping.
    continueOnBlock?: bool
    // Optional permission-rule-syntax filter.
    if?: string
    // Model to use for evaluation.
    model?: string
    // Prompt to evaluate with LLM.
    prompt: string
    // Custom spinner message displayed while the hook runs
    statusMessage?: string
    // Optional timeout in seconds (default: 30)
    timeout?: number
    // Hook type
    type: "prompt"
} | {
    // Optional permission-rule-syntax filter.
    if?: string
    // Model to use for evaluation.
    model?: string
    // Prompt describing what to verify.
    prompt: string
    // Custom spinner message displayed while the hook runs
    statusMessage?: string
    // Optional timeout in seconds (default: 60)
    timeout?: number
    // Hook type
    type: "agent"
} | {
    // List of environment variable names permitted for interpolation in headers.
    allowedEnvVars?: list(string)
    // Custom HTTP headers (e.g., Authorization: Bearer token).
    headers?: map(string)
    // Optional permission-rule-syntax filter.
    if?: string
    // Custom spinner message displayed while the hook runs
    statusMessage?: string
    // Optional timeout in seconds (default: 600; lowered to 30 on UserPromptSubmit and 10 on MessageDisplay)
    timeout?: number
    // Hook type
    type: "http"
    // URL to POST hook input JSON to.
    url: string
} | {
    // Optional permission-rule-syntax filter.
    if?: string
    // Arguments passed to the tool.
    input?: map(any)
    // Name of a configured MCP server (must already be connected)
    server: string
    // Custom spinner message displayed while the hook runs
    statusMessage?: string
    // Optional timeout in seconds (default: 600; lowered to 30 on UserPromptSubmit and 10 on MessageDisplay)
    timeout?: number
    // Name of the tool to call on that server
    tool: string
    // Hook type
    type: "mcp_tool"
})

type claude-settings-hook-matcher = {
    // Array of hooks to execute
    hooks: list(claude-settings-hook-command)
    // Optional pattern to match event contexts, case-sensitive.
    matcher?: string
}

type claude-settings-permission-rule = string
