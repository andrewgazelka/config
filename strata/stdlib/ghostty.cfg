// Ghostty: the config, theme files and shaders. Ghostty's own keys sit on
// `ghostty` as it spells them; a list value repeats its key (`custom-shader`).

component config-file: string
component config-dir: string
component font: font
// Shader files to install under <config-dir>/shaders, by name.
component shader-files: map(any)
// trigger -> action; a list chains actions (`chain=...` lines).
component bindings: map(string | list(string))
// `ghostty.themes."<name>" { background: "..." }`; `palette` lists colors 0..n.
component themes: map(map(string | list(string)))


rule ghostty {
    if exists(ghostty) {
        const dir = (ghostty[config-dir] ?? "~/.config/ghostty")
        const font = (record(ghostty.font) ?? {})
        const settings = {
            ...record(ghostty)
            if (font.family ?? null) != null { font-family: font.family }
            if (font.size ?? null) != null { font-size: font.size }
        }
        files."${ghostty[config-file] ?? "${dir}/config"}" {
            file: kv([
                // Single keys first, then repeated ones, then keybinds.
                for k, v in settings { if kind(v) != "list" { [k, v] } }
                for k, v in settings { if kind(v) == "list" { for x in v { [k, x] } } }
                for trigger, action in (record(ghostty.bindings) ?? {}) {
                    if kind(action) == "list" {
                        for i, a in action {
                            if i == 0 { ["keybind", "${trigger}=${a}"] } else { ["keybind", "chain=${a}"] }
                        }
                    } else {
                        ["keybind", "${trigger}=${action}"]
                    }
                }
            ])
        }
        for name, f in (record(ghostty.shader-files) ?? {}) {
            files."${dir}/shaders/${name}" { file: f }
        }
        if exists(ghostty.themes) {
            for name, t in ghostty.themes.* {
                files."${dir}/themes/${name}" {
                    file: kv([
                        for k, v in record(t) {
                            if kind(v) == "list" {
                                for i, c in v { ["palette", "${i}=${c}"] }
                            } else {
                                [k, v]
                            }
                        }
                    ])
                }
            }
        }
    }
}
