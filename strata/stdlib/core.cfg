// The core: one file sink, the scopes that build files from parts, and the
// types app modules share. Its components are global: they type entities
// outside the apps. Inside an app entity (`zed`) only the app module's own
// declarations apply, and every other key is the app's.

// A file to materialize. Its entity is `files."<target path>"`, so two
// writers of one path are an ordinary merge conflict naming both.
component file: {
    content?: string    // the bytes, from json(), toml(), kv(), ini() or text()
    blob?: string       // blake3 of a file next to the config, from source()
    tree?: string       // blake3 of a directory, from tree()
    symlink?: string    // an absolute path to link to, from link()
    from?: string
    kind?: "copy" | "link"  // link (default): a symlink into the store; copy()
    mode?: string
}

// Shared by apps that set a font, so a prefab can carry it:
// `prefab typography { font { family: "Mono" } }`.
type font = { family?: string, size?: number, weight?: number }

// A directory linked entry by entry: `dirs."<target>" { public: entries("dir") }`
// links each top-level file or directory of `dir` to `<target>/<name>`, so
// the target stays a real directory an app may add its own entries to. Each
// layer adds its own component (`public`, `private`), and the entries of all
// of them merge by name.
component dirs: map(map(any))

rule dirs {
    if exists(dirs) {
        for target, d in dirs.* {
            for layer in values(record(d)) {
                for name, f in layer {
                    files."${target}/${name}" { file: f }
                }
            }
        }
    }
}

// A text file joined from named parts in name order:
// `texts."<target>" { "10-base": read("x.md") }`. Another layer adds a part
// instead of replacing the file.
component texts: map(map(string))

rule texts {
    if exists(texts) {
        for target, t in texts.* {
            files."${target}" { file: text(join(values(record(t)), "")) }
        }
    }
}
