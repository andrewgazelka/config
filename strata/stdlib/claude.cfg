// Claude Code: settings.json and keybindings.json. Claude Code's own keys
// sit on `claude` as it spells them; these fields are the module's.

component config-dir: string
// keybindings.json, as it is: `claude.keybindings { bindings: [...] }`.
component keybindings: any
// Claude Code's keys, typed key by key by the published schema
// (schemas/claude-settings.cfg): a misspelt key fails where the schema
// closes an object.
component claude: claude-settings


rule claude {
    if exists(claude) {
        const dir = (claude[config-dir] ?? "~/.claude")
        const settings = record(claude)
        if len(settings) > 0 {
            // Claude Code saves settings itself (/model, /config, approvals):
            // strata's keys merge into its file, and the keys it adds stay.
            files."${dir}/settings.json" { file: merge(json(settings)) }
        }
        if exists(claude.keybindings) {
            files."${dir}/keybindings.json" { file: json(record(claude.keybindings)) }
        }
    }
}
