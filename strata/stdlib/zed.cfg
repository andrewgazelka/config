// Zed: settings.json and keymap.json. Zed's own keys sit on `zed` as Zed
// spells them, nested objects as scopes; these fields are the module's.

component config-dir: string
// Shared through prefabs: buffer_font_family, buffer_font_size, ...
component font: font
// Installed at startup: auto_install_extensions.
component extensions: set(string)
// keymap.json: `zed.keymap.<context> { bindings { "<key>": "<action>" } }`,
// in `order` then context name; the context "" has none.
component keymap: map({ order?: int, bindings?: map(any) })
// Zed's own key, typed here.
component zed: { theme?: { mode: "dark" | "light" | "system", dark: string, light: string }, .. }


rule zed {
    if exists(zed) {
        const dir = (zed[config-dir] ?? "~/.config/zed")
        const font = (record(zed.font) ?? {})
        // Zed rewrites settings.json in place of a symlink, so these are copies.
        files."${dir}/settings.json" {
            file: copy(json({
                ...record(zed)
                for k, v in font { "buffer_font_${k}": v }
                if has(zed, extensions) {
                    auto_install_extensions: { for e in zed[extensions] { "${e}": true } }
                }
            }))
        }
        if exists(zed.keymap) {
            const blocks = sort-by([
                for name, ctx in zed.keymap.* {
                    { key: [ctx[order] ?? 0, name], context: name, bindings: record(ctx.bindings) ?? {} }
                }
            ], "key")
            files."${dir}/keymap.json" {
                file: copy(json([
                    for b in blocks {
                        if b.context == "" { { bindings: b.bindings } }
                        else { { context: b.context, bindings: b.bindings } }
                    }
                ]))
            }
        }
    }
}
