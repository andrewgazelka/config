// git: ~/.config/git/config from `git { section { key: value } }`. A scope
// inside a section is a subsection; a list repeats the key.

component config-dir: string


rule git {
    if exists(git) {
        const config = record(git)
        if len(config) > 0 {
            files."${(git[config-dir] ?? "~/.config/git")}/config" { file: ini(config) }
        }
    }
}
