// AeroSpace: aerospace.toml. AeroSpace's own keys sit on `aerospace` as
// AeroSpace spells them; these fields are the module's.

type layout = "floating" | "tiling"

component config-file: string
component config-dir: string
// key -> command: mode.main.binding.
component bindings: map(string | list(string))
// app id -> layout: on-window-detected rules.
component window-rules: map(layout)
// app-name substring -> layout, for apps without a stable id.
component window-name-rules: map(layout)


rule aerospace {
    if exists(aerospace) {
        const file = aerospace[config-file] ?? "${aerospace[config-dir] ?? "~/.config/aerospace"}/aerospace.toml"
        const rules = record(aerospace.window-rules) ?? {}
        const name-rules = record(aerospace.window-name-rules) ?? {}
        files."${file}" {
            file: toml({
                ...record(aerospace)
                enable-normalization-flatten-containers: true
                enable-normalization-opposite-orientation-for-nested-containers: false
                accordion-padding: default 100
                if exists(aerospace.bindings) { mode: { main: { binding: record(aerospace.bindings) } } }
                if exists(aerospace.window-rules) || exists(aerospace.window-name-rules) {
                    on-window-detected: [
                        for app, layout in rules { { if: { app-id: app }, run: "layout ${layout}" } }
                        for name, layout in name-rules {
                            { if: { app-name-regex-substring: name }, run: "layout ${layout}" }
                        }
                    ]
                }
            })
        }
    }
}
