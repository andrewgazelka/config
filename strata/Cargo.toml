[package]
name = "strata"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A config language of entities and components, and an incremental engine that materializes it"

[dependencies]
anyhow = "1"
blake3 = "1.8"
clap = { version = "4.6", features = ["derive", "env"] }
# fsync, F_BARRIERFSYNC and _exit, which std does not expose.
libc = "0.2"
# kqueue on macOS: no CoreServices framework, so darwin cross-builds need no SDK.
notify = { version = "8.2", default-features = false, features = ["macos_kqueue"] }
salsa = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned: the golden tests compare TOML output byte for byte.
toml = "=1.1.2"

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "latency"
harness = false

[profile.release]
debug = "line-tables-only"
