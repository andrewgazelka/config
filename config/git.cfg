// git: ~/.config/git/config, the global ignore file and the allowed signers.

const signing-key = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPSZ+Pm8k0eiCcVg8NNxBdjEUyBTI1h5SkOUtxEiEDjB"
const delta = "${pkgs.delta[store-path]}/bin/delta"
const lfs = "${pkgs.git-lfs[store-path]}/bin/git-lfs"
const gh-helper = "!${pkgs.gh[store-path]}/bin/gh auth git-credential"

git {
    user {
        name: "Andrew Gazelka"
        email: "andrew.gazelka@gmail.com"
        // The on-disk key, so signing never waits on 1Password.
        signingKey: "${user[home]}/.ssh/id_ed25519"
    }
    gpg {
        format: "ssh"
        ssh {
            allowedSignersFile: "${user[home]}/.config/git/allowed_signers"
            program: "${pkgs.openssh[store-path]}/bin/ssh-keygen"
        }
    }
    commit { gpgSign: true, verbose: true, cleanup: "scissors" }
    tag { gpgSign: true }

    alias {
        lg: "log --pretty=format:'%s %C(dim)%h%C(reset)'"
        dft: "diff --ext-diff"
        sync: "!git pull --rebase && git push"
    }
    core { excludesfile: "${user[home]}/.config/git/ignore", untrackedcache: true }
    init { defaultBranch: "main" }
    pull { rebase: true }
    push { autoSetupRemote: true, followTags: true }
    fetch { prune: true, parallel: 0 }
    rebase { autoSquash: true, autoStash: true, updateRefs: true }
    // Every branch lands as one revertable merge.
    merge { conflictstyle: "zdiff3", ff: false }
    rerere { enabled: true, autoupdate: true }
    diff { algorithm: "histogram", external: "difft" }
    log { date: "relative" }
    blame { coloring: "highlightRecent" }
    advice { statusHints: false }
    column { ui: "auto" }
    branch { sort: "-committerdate" }
    maintenance { auto: false }

    // gh supplies GitHub credentials; "" first clears inherited helpers.
    credential {
        for host in ["https://github.com", "https://gist.github.com"] { "${host}" { helper: ["", gh-helper] } }
    }

    // Git LFS.
    filter {
        lfs {
            clean: "${lfs} clean -- %f"
            smudge: "${lfs} smudge -- %f"
            process: "${lfs} filter-process"
            required: true
        }
    }

    // delta as the pager.
    pager { for p in ["diff", "log", "show", "blame"] { "${p}": delta } }
    interactive { diffFilter: "${delta} --color-only" }
    delta { navigate: true, side-by-side: true }
}

files {
    "~/.config/git/ignore" { file: source("git/gitignore") }
    "~/.config/git/allowed_signers" { file: text("andrew.gazelka@gmail.com namespaces=\"git\" ${signing-key}\n") }
}
