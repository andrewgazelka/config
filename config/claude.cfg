// Claude Code: settings, keybindings, the status line, agents and skills.
// AGENTS.md and skills/ are shared by every agent that reads them.

claude {
    env { ENABLE_TOOL_SEARCH: "auto"; CLAUDE_CODE_MAX_CONCURRENT_SUBAGENTS: "40" }
    permissions {
        allow: ["Read"]
        deny: [
            "DesignSync",
            "NotebookEdit",
            "EnterWorktree",
            "ExitWorktree",
            "RemoteTrigger",
            "EndConversation",
            "EnterPlanMode",
            "AskUserQuestion",
            "SendFeedback",
            "ReportFindings",
            "ListMcpResourcesTool",
            "ReadMcpResourceTool",
            "ReadMcpResourceDirTool",
            "mcp__claude-in-chrome",
            "mcp__claude_ai_Claude_Docs",
        ]
        defaultMode: "dontAsk"
    }
    model: "opus"
    statusLine { type: "command"; command: "~/.claude/statusline.sh" }
    enabledPlugins {
        "py-diff@andrew-mods": true
        "andrew-hooks@andrew-mods": true
        "rust-analyzer-lsp@claude-plugins-official": true
        "pyright-lsp@claude-plugins-official": true
        "exa@claude-plugins-official": true
    }
    extraKnownMarketplaces {
        andrew-mods { source { source: "directory"; path: "/Volumes/Projects/andrewgazelka/cc-mods" } }
    }
    effortLevel: "high"
    modelSettings {
        claude-fable-5 { effortLevel: "xhigh" }
        claude-fable-5-1 { effortLevel: "high" }
        claude-opus-5-5 { effortLevel: "medium"; autoCompactWindow: 300000 }
        claude-sonnet-5-5 { effortLevel: "medium"; autoCompactWindow: 500000 }
    }
    autoCompactWindow: 300000
    tui: "fullscreen"
    skipDangerousModePermissionPrompt: true
    theme: "auto"
    verbose: false
    switchModelsOnFlag: true
    agentPushNotifEnabled: true

    keybindings {
        "\$docs": "https://code.claude.com/docs/en/keybindings"
        "\$schema": "https://www.schemastore.org/claude-code-keybindings.json"
        bindings: [{ bindings: { "ctrl+h": "footer:up" }, context: "Footer" }]
    }
}

files."~/.claude/statusline.sh" { file: source("agents/claude/statusline.sh") }

// Linked entry by entry: Claude Code writes skills/synced itself, and a
// private layer adds its own skills and agents beside these.
dirs {
    "~/.claude/agents" { public: entries("agents/claude/agents") }
    for dir in ["~/.agents", "~/.claude"] {
        "${dir}/skills" { public: entries("agents/skills") }
    }
}

// One instruction file for every agent; a private layer appends its lines.
texts {
    for f in ["~/.agents/AGENTS.md", "~/.codex/AGENTS.md", "~/.claude/CLAUDE.md"] {
        "${f}" { "00-public": read("agents/AGENTS.md") }
    }
}
