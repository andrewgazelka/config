// AeroSpace window manager.

const workspaces = 1..10
const directions = { h: "left", j: "down", k: "up", l: "right" }

aerospace {
    config-file: "~/.aerospace.toml"
    // launchd starts AeroSpace (home/darwin.nix), not AeroSpace itself.
    after-login-command: []
    start-at-login: false
    accordion-padding: 100
    workspace-to-monitor-force-assignment {
        for n in workspaces { "${n}": if n == 9 { "secondary" } else { "main" } }
    }

    bindings {
        for n in workspaces {
            "alt-${n}": "workspace ${n}"
            "alt-shift-${n}": "move-node-to-workspace ${n}"
        }
        for k, d in directions {
            "alt-${k}": "focus --boundaries-action stop --ignore-floating ${d}"
            "ctrl-alt-shift-${k}": "move ${d}"
            "alt-shift-${k}": "join-with ${d}"
        }
        alt-tab: "workspace-back-and-forth"
        alt-backtick: "focus-back-and-forth"
        alt-a: "layout tiles accordion"
        alt-shift-e: "balance-sizes"
        alt-shift-minus: "resize smart -50"
        alt-shift-equal: "resize smart +50"
    }

    window-rules {
        for app in ["com.apple.FaceTime", "com.obsproject.obs-studio", "com.paulsolt.SuperEasyTimerMac"] { "${app}": "floating" }
        for app in ["com.linear", "com.microsoft.Excel", "notion.id"] { "${app}": "tiling" }
    }
}
