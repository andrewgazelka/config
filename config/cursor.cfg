// Cursor (VS Code): settings and keybindings.

// This repo, for nixd's option completion.
const flake = "/Volumes/Projects/nix"

cursor.keybindings {
    // Editor
    "ctrl+j" { "editor.action.showHover" { when: "editorTextFocus" } }
    "shift+cmd+b" { "editor.action.goToTypeDefinition" { when: "editorHasTypeDefinitionProvider && editorTextFocus" } }
    "shift+cmd+s" { "workbench.action.gotoSymbol" { when: "editorTextFocus" } }
    "cmd+u" { "rust-analyzer.parentModule" { when: "editorTextFocus && editorLangId == 'rust'" } }
    "alt+d" { "editor.action.moveSelectionToNextFindMatch" { when: "editorFocus" } }
    "alt+shift+n" { "editor.action.addSelectionToPreviousFindMatch" { when: "editorFocus" } }
    "ctrl+r" { redo { when: "editorTextFocus" } }
    "alt+j" {
        "editor.action.marker.nextInFiles" { when: "editorFocus" }
        "list.focusDown" { when: "problemsViewFocus" }
    }
    "alt+k" {
        "editor.action.marker.prevInFiles" { when: "editorFocus" }
        "list.focusUp" { when: "problemsViewFocus" }
    }
    escape { "workbench.action.focusActiveEditorGroup" { when: "sideBarFocus" } }

    // ctrl+n / ctrl+p move through menus, like vim.
    "ctrl+n" {
        selectNextSuggestion { when: "suggestWidgetMultipleSuggestions && suggestWidgetVisible && textInputFocus" }
        selectNextCodeAction { when: "codeActionMenuVisible" }
        unbind: ["editor.emmet.action.nextEditPoint", "workbench.action.quickOpenSelectNext"]
    }
    "ctrl+p" { selectPrevCodeAction { when: "codeActionMenuVisible" } }

    // Git and AI
    "alt+b" { "gitlens.toggleFileBlame" { when: "editorTextFocus" } }
    "shift+cmd+c" {
        "gitlens.copyRemoteFileUrlToClipboard" { when: "editorTextFocus" }
        unbind: ["workbench.action.terminal.openNativeConsole"]
    }
    "cmd+i" { "composerMode.agent" {} }
    "ctrl+cmd+p" { "composerMode.plan" {} }

    // Terminal: shift+enter inserts a line continuation.
    "shift+enter" {
        "workbench.action.terminal.sendSequence" { when: "terminalFocus"; args { text: "\\\r\n" } }
    }

    // Free keys that vim (vscode-neovim) or the bindings above want.
    "ctrl+d" { unbind: ["deleteRight", "workbench.action.debug.run"] }
    "cmd+b" { unbind: ["workbench.action.toggleSidebarVisibility"] }
    "cmd+e" { unbind: ["composer.showBackgroundAgentHistory"] }
    "cmd+]" { unbind: ["editor.action.indentLines"] }
    "cmd+n" { unbind: ["workbench.action.files.newUntitledFile", "editor.action.inlineDiffs.rejectPartialEdit", "editor.action.sourceAction"] }
    "shift+cmd+s" { unbind: ["workbench.action.files.saveAs", "workbench.action.files.saveLocalFile", "workbench.action.backgroundComposer.toggleSidebar"] }
    "shift+cmd+[" { unbind: ["workbench.action.terminal.focusPrevious", "workbench.action.debug.prevConsole"] }
    "shift+cmd+]" { unbind: ["workbench.action.terminal.focusNext", "workbench.action.debug.nextConsole"] }
    "alt+cmd+k" { unbind: ["git.pushTo", "keybindings.editor.recordSearchKeys"] }

    // cmd+k and its chords
    "cmd+k" { unbind: ["git.commitAll", "cursorai.action.generateInTerminal", "editor.action.inlineDiffs.focusEditor", "workbench.debug.panel.action.clearReplAction"] }
    "cmd+k cmd+r" { unbind: ["git.revertSelectedRanges"] }
    "cmd+k cmd+n" { unbind: ["git.unstageSelectedRanges"] }
    "cmd+k alt+cmd+s" { unbind: ["git.stageSelectedRanges"] }
    "cmd+k cmd+i" { unbind: ["workbench.action.showHover"] }
    "cmd+k v" { unbind: ["markdown.showPreviewToSide", "typst-preview.preview"] }
    "cmd+k m" { unbind: ["notebook.cell.changeLanguage"] }
}

// Only values that differ from Cursor / VS Code and extension defaults.
cursor {
    "workbench.preferredDarkColorTheme": "Islands Dark"
    "workbench.preferredLightColorTheme": "Islands Light"
    "window.autoDetectColorScheme": true
    "workbench.iconTheme": "vscode-jetbrains-icon-theme-2023-auto"
    "editor.fontFamily": "'Berkeley Mono', monospace"
    "editor.fontLigatures": true
    "editor.lineHeight": 1.1
    "editor.inlayHints.fontFamily": "Berkeley Mono"
    "editor.inlayHints.fontSize": 11
    "editor.inlayHints.maximumLength": 1000
    "terminal.integrated.fontSize": 11
    "markdown.preview.lineHeight": 1.2
    "window.zoomLevel": -1
    "window.density.editorTabHeight": "compact"
    "window.title": "\${rootName}"
    "editor.cursorBlinking": "solid"
    "breadcrumbs.enabled": false
    "editor.minimap.enabled": false
    "editor.glyphMargin": false
    "editor.folding": false
    "editor.codeLens": false
    "editor.scrollbar.horizontal": "hidden"
    "editor.scrollbar.vertical": "hidden"
    "workbench.activityBar.location": "hidden"
    "workbench.navigationControl.enabled": false
    "workbench.editor.tabSizing": "shrink"
    "workbench.editor.pinnedTabSizing": "shrink"
    "workbench.editor.tabActionCloseVisibility": false
    "workbench.editor.tabActionUnpinVisibility": false
    "workbench.tree.renderIndentGuides": "none"
    "outline.showKeys": false
    "outline.showProperties": false
    "outline.showVariables": false
    "git.showActionButton" { commit: false, publish: false, sync: false }
    "git.showCommitInput": false
    "scm.defaultViewMode": "tree"
    "editor.lineNumbers": "relative"
    "editor.cursorSurroundingLines": 50
    "editor.formatOnSave": true
    "editor.formatOnPaste": true
    "editor.find.loop": false
    "editor.parameterHints.enabled": false
    "editor.inlineSuggest.enabled": false
    "editor.wordBasedSuggestions": "off"
    "editor.renderValidationDecorations": "on"
    "editor.accessibilitySupport": "off"
    "files.autoSave": "afterDelay"
    "files.associations" { "*.svx": "svelte" }
    "workbench.editorAssociations" { "*.md": "vscode.markdown.preview.editor" }
    "workbench.editor.focusRecentEditorAfterClose": false
    "window.openFoldersInNewWindow": "on"
    "explorer.excludeGitIgnore": true
    "explorer.confirmDelete": false
    "explorer.confirmDragAndDrop": false
    "problems.showCurrentInStatus": true
    "security.promptForLocalFileProtocolHandling": false
    "git.openRepositoryInParentFolders": "never"
    "terminal.integrated.defaultProfile.osx": "nu"
    "terminal.integrated.profiles.osx" { nu { path: "/run/current-system/sw/bin/nu" } }
    "update.mode": "silentlyApplyOnQuit"
    "update.releaseTrack": "dev"
    "extensions.experimental.affinity" { "asvetliakov.vscode-neovim": 1 }
    "vim.disableExtension": true
    "cursor.composer.shouldChimeAfterChatFinishes": true
    "cursor.composer.usageSummaryDisplay": "always"
    "cursor.composer.queueManualSendBehavior2": "steer"
    "cursor.cpp.enablePartialAccepts": true
    "cursor.inlineDiff.enablePerformanceProtection": false
    "cursor.terminal.usePreviewBox": true
    "cursor-retrieval.canAttemptGithubLogin": false
    "claudeCode.allowDangerouslySkipPermissions": true
    "claudeCode.initialPermissionMode": "bypassPermissions"
    "errorLens.messageBackgroundMode": "none"
    "errorLens.replaceLinebreaksSymbol": "; "
    "gitlens.blame.format": "\${author|2?}"
    "gitlens.blame.heatmap.enabled": false
    "gitlens.blame.highlight.enabled": false
    "gitlens.blame.ignoreWhitespace": true
    "gitlens.blame.separateLines": false
    "gitlens.codeLens.authors.enabled": false
    "gitlens.currentLine.format": "\${author}, \${agoOrDate} • \${message}"
    "gitlens.currentLine.scrollable": false
    "gitlens.defaultDateFormat": "MMM D, YYYY"
    "gitlens.defaultDateShortFormat": "M/D/YY"
    "gitlens.hovers.avatarSize": 24
    "direnv.restart.automatic": true
    "redhat.telemetry.enabled": false
    "jupyter.askForKernelRestart": false
    "svelte.enable-ts-plugin": true
    "python.languageServer": "None"
    "[python]" {
        "editor.defaultFormatter": null
        "editor.codeActionsOnSave" { "source.fixAll.ruff": "explicit", "source.organizeImports.ruff": "explicit" }
    }
    "[rust]" { "editor.defaultFormatter": "rust-lang.rust-analyzer" }
    "[nix]" { "editor.defaultFormatter": "jnoortheen.nix-ide" }
    "[dockerfile]" { "editor.detectIndentation": false, "editor.tabSize": 4 }
    "[svelte]" { "editor.formatOnSave": false }
    "nix.enableLanguageServer": true
    "nix.serverSettings" {
        nixd {
            formatting { command: ["nixfmt"] }
            options {
                nixpkgs { expr: "import (builtins.getFlake \"${flake}\").inputs.nixpkgs { }" }
                nix-darwin {
                    expr: "(builtins.getFlake \"${flake}\").darwinConfigurations.hydra.options"
                }
                home-manager {
                    expr: "(builtins.getFlake \"${flake}\").darwinConfigurations.hydra.options.home-manager.users.type.getSubOptions []"
                }
            }
        }
    }
    "rust-analyzer.server.path": "rust-analyzer"
    "rust-analyzer.assist.preferSelf": true
    "rust-analyzer.imports.granularity.enforce": true
    "rust-analyzer.imports.preferNoStd": true
    "rust-analyzer.references.excludeImports": true
    "rust-analyzer.lens.implementations.enable": false
    "rust-analyzer.inlayHints.parameterHints.enable": false
    "rust-analyzer.inlayHints.bindingModeHints.enable": true
    "rust-analyzer.inlayHints.genericParameterHints.lifetime.enable": true
    "rust-analyzer.inlayHints.implicitDrops.enable": true
    "rust-analyzer.inlayHints.implicitSizedBoundHints.enable": true
    "evenBetterToml.formatter.alignComments": true
    "evenBetterToml.formatter.arrayTrailingComma": true
    "evenBetterToml.formatter.columnWidth": 100
    "evenBetterToml.formatter.reorderArrays": false
    "evenBetterToml.formatter.reorderInlineTables": true
    "evenBetterToml.formatter.reorderKeys": true
}
