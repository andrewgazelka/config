// tmux. Only values that differ from tmux's defaults.

tmux {
    // Non-login zsh: a login shell would rerun macOS path_helper and reorder PATH.
    global-options {
        default-shell: "/bin/zsh"
        default-command: "/bin/zsh"
        escape-time: 0
        focus-events: "on"
        mouse: "on"
        history-limit: 50000
        base-index: 1
        renumber-windows: "on"
        aggressive-resize: "on"
        allow-rename: "on"
        set-titles: "on"
        set-clipboard: "on"
        allow-passthrough: "on"
        display-time: 4000

        // Flag windows with activity or a bell (the shell rings one when a
        // command finishes); no popups.
        bell-action: "other"
        silence-action: "none"

        // Look
        status-interval: 1
        status-style: "bg=#1c1c1c fg=#d0d0d0"
        status-left: "#{?client_prefix,#[fg=colour234 bg=colour108] PREFIX ,}"
        status-left-length: 40
        status-right: "#{?synchronize-panes,#[fg=#d75f5f bold] SYNC ,}#[fg=#808080]#{pane_width}x#{pane_height} #[fg=#a8a8a8]#{cursor_x}:#{cursor_y} "
        status-right-length: 60
        window-status-separator: "  "
        window-status-format: "#{?window_bell_flag,#[fg=#1c1c1c bg=#d46a6a],#[fg=#c0c0c0 bg=#333333]} #I #[bg=default] #{?window_bell_flag,#[fg=#e57373],#[fg=#888888]}#{b:pane_current_path} #W"
        window-status-current-format: "#{?window_bell_flag,#[fg=#1c1c1c bg=#d46a6a],#[fg=#1c1c1c bg=#e0e0e0]}#[bold] #I #[bg=default] #{?window_bell_flag,#[fg=#e57373],#[fg=#ffffff]}#{b:pane_current_path} #W#{?window_zoomed_flag,#[fg=#d4a656] 󰊓,}"
        window-status-bell-style: "fg=colour167,bold"
        pane-border-style: "fg=#3a3a3a"
        pane-active-border-style: "fg=#c0c0c0"
        message-style: "fg=#e4e4e4,bg=#303030,bold"
        message-command-style: "fg=#e4e4e4,bg=#444444"
        mode-style: "fg=#1c1c1c,bg=#87af87,bold"
    }
    window-options {
        pane-base-index: 1
        automatic-rename: "off"
        mode-keys: "vi"
        monitor-activity: "on"
    }
    environment { CLAUDE_CODE_TMUX_TRUECOLOR: 1 }

    // Outer terminal capabilities (truecolor, undercurl, CSI-u keys, OSC 52).
    // Ghostty sends cmd+enter as CSI 13;9u: User0 below.
    server-options { extended-keys: "on", "user-keys[0]": r"\e[13;9u" }
    append-options {
        terminal-features: [
            "xterm-ghostty:RGB:256:clipboard:ccolour:cstyle:extkeys:focus:hyperlinks:margins:overline:rectfill:sixel:strikethrough:sync:title:usstyle"
            "xterm-256color:RGB:256:clipboard:ccolour:cstyle:extkeys:focus:hyperlinks:margins:overline:rectfill:strikethrough:sync:title:usstyle"
        ]
    }

    key-tables {
        prefix {
            // New windows and splits start in the current directory.
            c: "new-window -c '#{pane_current_path}'"
            "\"": "split-window -c '#{pane_current_path}'"
            "%": "split-window -h -c '#{pane_current_path}'"
            r: r"source-file ~/.config/tmux/tmux.conf \; display-message 'Config reloaded'"
            m: r"setw monitor-activity \; display-message 'Activity monitoring: #{?monitor-activity,ON,OFF}'"
            M: r"setw monitor-silence 5 \; display-message 'Silence monitoring: 5s'"
        }
        root {
            User0: "split-window -c '#{pane_current_path}'"
            // Open the whole scrollback in nvim.
            M-e: r#"run-shell "tmux capture-pane -pS - > /tmp/tmux-buffer && nvim '+ normal G' /tmp/tmux-buffer""#
            M-k: r"clear-history \; display-message 'History cleared'"
            M-M: r"setw monitor-silence 0 \; display-message 'Silence monitoring: OFF'"
        }
        copy-mode-vi {
            v: "send-keys -X begin-selection"
            y: "send-keys -X copy-pipe-and-cancel pbcopy"
            Escape: "send-keys -X cancel"
        }
    }
}
