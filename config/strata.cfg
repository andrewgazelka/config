// What this config is built from, so `strata apply` by hand, `plan`,
// `watch` and the login agent (home/strata.nix) all build one generation.

// The private checkout's layer: fleet ssh, rbw, private agents and skills.
// A public clone builds without it; a switch that would drop it from a
// generation that had it is refused (`--drop-layer` says it's on purpose).
layer optional "../private/config"

// Store paths (delta, gh, ...) from the system's nixpkgs: home/strata.nix
// writes the table, built from nix/facts.nix, and keeps the paths alive.
component store-path: string
facts pkgs: store-path from "~/.config/strata/facts/pkgs.json"
