// Andrew's Mac. Every dotfile under ~ comes from here; code-shaped config
// (nvim, nushell) is linked as files.

// Store paths from the nixpkgs the system uses (the repo's flake.lock).
// `strata nix-facts` evaluates nix/facts.nix once per lock and caches it;
// the login agent (home/strata.nix) passes the system's own table instead.
component store-path: string
facts pkgs: store-path from nix "nix/facts.nix" lock "../flake.lock"

// Some apps want absolute paths; other files read `user[home]`.
component home: string
user { home: "/Users/andrewgazelka" }

// Shared by the editors and the terminal.
prefab typography {
    font { family: "Berkeley Mono" }
}
