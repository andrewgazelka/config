// Starship prompt, layered over the nerd-font-symbols preset.

starship : nerd-font-symbols {
    format: r"${custom.submodule_chain}$username$hostname$localip$directory${custom.physical_dir}$git_branch$git_status$all$line_break$character"
    scan_timeout: 200
    directory { substitutions { "~/Projects/": "" } }
    memory_usage { disabled: false, threshold: 95, style: "bold dimmed green" }
    // Name the shell only when it isn't nu or fish.
    shell { disabled: false, format: "[$indicator]($style)", nu_indicator: "", fish_indicator: "" }
    // Shown inside a Claude Code shell, which sets CLAUDECODE=1.
    env_var { CLAUDECODE { format: "[🤖](bold blue) " } }
    // Runtime and cloud noise.
    for m in ["aws", "buf", "bun", "gcloud", "nodejs", "package", "python", "rust", "swift", "typst", "nix_shell", "git_commit"] {
        "${m}" { disabled: true }
    }
}

// Superprojects when inside a git submodule: "outer › inner ›".
starship.custom.submodule_chain : sh-module {
    command: r"""
        sup=$(git rev-parse --show-superproject-working-tree 2>/dev/null); names=""
        while [ -n "$sup" ]; do
          names="$(basename "$sup")${names:+ › $names}"
          sup=$(git -C "$sup" rev-parse --show-superproject-working-tree 2>/dev/null)
        done
        printf "%s" "$names"

        """
    when: true
    require_repo: true
    format: "([$output ›]($style) )"
}

// Real path when the cwd was reached through a symlink.
starship.custom.physical_dir : sh-module {
    command: "pwd -P"
    when: r#"[ "$PWD" != "$(pwd -P)" ]"#
    format: "[$output]($style) "
}

starship.custom.commit_age : sh-module {
    command: "git log -1 --format=%cr 2>/dev/null"
    when: true
    require_repo: true
    format: "([$output]($style) )"
    // Plain beats the prefab's inherited "dimmed": no override needed.
    style: "italic dimmed"
}
