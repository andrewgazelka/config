// Ghostty: config, two themes and two shaders. Reload with cmd+shift+r.
// Only values that differ from Ghostty's defaults.

ghostty : typography {
    config-file: "~/.config/ghostty/config.ghostty"
    font { size: 12 }
    theme: "dark:custom-dark,light:custom-light"
    split-divider-color: "2a2a2a"
    cursor-style-blink: false

    window-decoration: "none"
    window-padding-x: 5
    window-padding-y: 5
    scrollbar: "never"
    scrollback-limit-bytes: "unlimited"

    macos-option-as-alt: true
    macos-icon: "custom-style"
    macos-icon-frame: "chrome"
    macos-icon-ghost-color: "111111"
    macos-icon-screen-color: "222222"

    clipboard-read: "allow"
    clipboard-paste-protection: false
    confirm-close-surface: false
    // Tear closed surfaces down at once; the undo buffer keeps them alive
    // (ghostty#7535).
    undo-timeout: 0

    // Updates come from the `ghostty@tip` Homebrew cask, not Sparkle.
    auto-update: "off"
    auto-update-channel: "tip"

    // Subtle CRT look, then an outline on the focused pane.
    custom-shader: ["~/.config/ghostty/shaders/crt.glsl", "~/.config/ghostty/shaders/focus-border.glsl"]
    shader-files { "crt.glsl": source("ghostty/shaders/crt.glsl"), "focus-border.glsl": source("ghostty/shaders/focus-border.glsl") }

    bindings {
        "cmd+shift+r": "reload_config"
        "cmd+shift+a": "toggle_command_palette"
        // Leave cmd+a to the program inside.
        "cmd+a": "unbind"

        // Text sent to the shell: ctrl+u (kill line), alt+enter, CSI-u cmd+enter.
        "cmd+backspace": r"text:\x15"
        "shift+enter": r"text:\x1b\r"
        "cmd+enter": r"text:\x1b[13;9u"

        // Copy the whole scrollback.
        "cmd+shift+c": ["select_all", "copy_to_clipboard"]
        "cmd+shift+v": "paste_from_clipboard"
        "cmd+shift+s": "write_screen_file:copy"
        "performable:cmd+shift+u": "copy_url_to_clipboard"

        "cmd+up": "scroll_to_top"
        "cmd+down": "scroll_to_bottom"

        "alt+tab": "goto_split:next"
        "shift+alt+tab": "goto_split:previous"
        "cmd+shift+left": "goto_split:left"
        "cmd+shift+right": "goto_split:right"
        "cmd+shift+up": "goto_split:up"
        "cmd+shift+down": "goto_split:down"
    }
}

// Complementary to the light theme: dark background, light text.
ghostty.themes.custom-dark {
    background: "1e1e1e"
    foreground: "d4d4d4"
    palette: [
        "000000", "f38ba8", "a6e3a1", "f9e2af", "89b4fa", "cba6f7", "94e2d5", "e0d8c0",
        "585b70", "f38ba8", "a6e3a1", "f9e2af", "89b4fa", "cba6f7", "94e2d5", "faf0c8",
    ]
    cursor-color: "f5e0dc"
    cursor-text: "1e1e1e"
    selection-background: "313244"
    selection-foreground: "d4d4d4"
}

// Based on iTerm2's colors: light background, dark text.
ghostty.themes.custom-light {
    background: "f9f9f9"
    foreground: "2a2c33"
    palette: [
        "000000", "db3f39", "42933e", "855504", "325eee", "930093", "0e70ae", "8f9096",
        "2a2c33", "db3f39", "42933e", "855504", "325eee", "930093", "0e70ae", "ffffff",
    ]
    cursor-color: "bbbbbb"
    cursor-text: "2a2c33"
    selection-background: "e9e9e9"
    selection-foreground: "332c2a"
}
