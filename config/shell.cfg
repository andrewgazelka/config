// The shell side: nushell (code, linked as files), session variables,
// atuin, direnv and ssh.

const nu-dir = "~/Library/Application Support/nushell"

// The environment every shell gets. A user-written rule renders it for
// nushell below; nothing about it is special to the stdlib.
component env: map(string)
session {
    env {
        EDITOR: "nvim"
        VISUAL: "nvim"
        PAGER: "moor"
        MOOR: "--wrap --quit-if-one-screen"
        LESS: "-R"
        // Byte-order sorting everywhere.
        LC_COLLATE: "C"
        RUST_BACKTRACE: "1"
        // atuin owns ctrl-r.
        FZF_CTRL_R_COMMAND: ""
        STARSHIP_CONFIG: "${user[home]}/.config/starship.toml"
        TERMINFO_DIRS: "${user[home]}/.nix-profile/share/terminfo:\$TERMINFO_DIRS\${TERMINFO_DIRS:+:}/usr/share/terminfo"
    }
}

rule session-vars {
    files."~/.config/nushell-session-vars.nu" {
        file: text(join([for k, v in record(session.env) { "\$env.${k} = ${to-json(v)}" }], "\n") + "\n")
    }
}

files {
    // Each entry, not the whole directory: nushell writes history there.
    for f in ["abbreviations.nuon", "completions.nu", "config.nu", "env.nu"] {
        "${nu-dir}/${f}" { file: source("nushell/${f}") }
    }
    "${nu-dir}/functions" { file: tree("nushell/functions") }
    // Prompt, jump and history hooks, generated by nix from the binaries.
    "${nu-dir}/vendor" { file: link(pkgs.nushell-vendor[store-path]) }

    "~/.config/nvim" { file: tree("nvim") }

    "~/.config/atuin/config.toml" {
        file: toml({
            auto_sync: true
            enter_accept: true
            style: "compact"
            update_check: false
            search_mode: "daemon-fuzzy"
            workspaces: true
            store_failed: true
            secrets_filter: true
            sync: { records: true }
            daemon: {
                enabled: true
                sync_frequency: 15
                socket_path: "${user[home]}/.local/share/atuin/daemon.sock"
                systemd_socket: false
            }
        })
    }

    // Quiet direnv, with nix-direnv's library.
    "~/.config/direnv/direnv.toml" { file: toml({ global: { log_format: "" } }) }
    "~/.config/direnv/lib/nix-direnv.sh" {
        file: link("${pkgs.nix-direnv[store-path]}/share/nix-direnv/direnvrc")
    }

    "~/.hushlogin" { file: text("") }
    // ssh's ControlPath below needs the directory.
    "~/.ssh/controlmasters/.keep" { file: text("") }
}

ssh.hosts {
    "github.com" {
        ControlMaster: "auto"
        ControlPath: "~/.ssh/controlmasters/%r@%h-%p"
        ControlPersist: "10m"
        ServerAliveInterval: 60
    }
    "*" {
        ForwardAgent: false
        AddKeysToAgent: "no"
        HashKnownHosts: false
        IdentityFile: ["~/.ssh/id_ed25519", "~/.ssh/id_ed25519_legacy"]
        SetEnv { TERM: "xterm-256color", COLORTERM: "truecolor" }
    }
}
